<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>체중 기록</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1720; --card:#17212c; --line:#243241; --text:#e8eef4; --sub:#8a9bab;
  --accent:#4fb3a9; --accent2:#e0a95b; --up:#e07a6b; --down:#5fb98a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:14px;color:var(--sub);font-weight:600;margin:0 0 10px}
.up{color:var(--up)} .down{color:var(--down)}

/* 입력 카드 */
.datebar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.datebar h2{font-size:17px;color:var(--text);margin:0}
.datebar input{background:transparent;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:6px 8px;font-size:14px;color-scheme:dark}
.badge{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.badge.ok{background:rgba(95,185,138,.18);color:var(--down)}
.badge.warn{background:rgba(224,169,91,.16);color:var(--accent2)}
.entry{display:flex;align-items:center;gap:8px}
.step{width:56px;height:64px;border-radius:12px;border:1px solid var(--line);background:#1d2935;
  color:var(--text);font-size:20px;font-weight:600}
.step:active{background:#2a3a4a}
#w{flex:1;min-width:0;height:64px;text-align:center;font-size:36px;font-weight:700;
  background:#0c131a;color:var(--text);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
#w:focus{outline:2px solid var(--accent)}
#save{width:100%;height:56px;margin-top:12px;border:0;border-radius:12px;background:var(--accent);
  color:#062420;font-size:18px;font-weight:700;transition:background .2s,opacity .2s}
#save:active{filter:brightness(.9)}
#save.quiet{opacity:.55}
#save.done{background:#7ee0b0;opacity:1;animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
#goToday{display:block;width:100%;margin:0 0 12px;padding:12px;border-radius:12px;border:1px solid var(--accent2);
  background:rgba(224,169,91,.14);color:var(--accent2);font-size:15px;font-weight:700}
#goToday[hidden]{display:none}
#msg{text-align:center;font-size:13px;color:var(--accent2);min-height:18px;margin-top:8px}

/* 저장 완료 연출 */
#ok{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,12,18,.6);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#ok.show{opacity:1}
.okbox{background:var(--card);border:1px solid var(--accent);border-radius:24px;padding:28px 40px;text-align:center;
  transform:scale(.8);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
#ok.show .okbox{transform:scale(1)}
.okc{width:84px;height:84px;border-radius:50%;background:var(--accent);margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.okc svg{width:46px;height:46px}
.okc path{stroke:#062420;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
#ok.show .okc path{animation:draw .45s .1s forwards ease-out}
@keyframes draw{to{stroke-dashoffset:0}}
.okt{font-size:14px;color:var(--sub)}
.okw{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.okd{font-size:15px;margin-top:4px;min-height:20px}

/* 최근 3일 */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:#1d2935;border-radius:12px;padding:10px 4px;text-align:center;border:2px solid transparent}
.cell.sel{border-color:var(--accent)}
.cell .k{font-size:12px;color:var(--sub)}
.cell .v{font-size:26px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.cell .v.miss{color:var(--sub);font-weight:600}
.cell .s{font-size:13px;min-height:17px;font-variant-numeric:tabular-nums}
.cell .s.warn{color:var(--accent2);font-weight:600}
.cell .s.mute{color:var(--sub)}

/* 추세 */
.trend{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px;background:#1d2935;border-left:6px solid var(--sub)}
.trend .arrow{font-size:46px;line-height:1;font-weight:700;width:58px;text-align:center;color:var(--sub)}
.trend .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.trend .big small{font-size:15px;font-weight:600;margin-left:4px;color:var(--sub)}
.trend .tsub{font-size:13px;color:var(--sub);margin-top:4px}
.trend.good{border-color:var(--down);background:rgba(95,185,138,.12)}
.trend.good .arrow,.trend.good .big{color:var(--down)}
.trend.bad{border-color:var(--up);background:rgba(224,122,107,.12)}
.trend.bad .arrow,.trend.bad .big{color:var(--up)}

/* 목표 막대 */
.gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gh b{font-size:30px;font-variant-numeric:tabular-nums}
.gh span{font-size:14px;color:var(--sub)}
.gbar{height:16px;border-radius:999px;background:#0c131a;overflow:hidden;border:1px solid var(--line)}
.gbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3a8f87,var(--accent))}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.gs{font-size:13px;color:var(--text);margin-top:8px}

/* BMI 막대 */
.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bh b{font-size:30px;font-variant-numeric:tabular-nums}
.bh span{font-size:15px;font-weight:700}
.bmiwrap{position:relative;padding-top:14px}
.bmibar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.bmibar i{display:block;height:100%}
.mk{position:absolute;top:0;transform:translateX(-50%);width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #fff}
.bticks{position:relative;height:16px;margin-top:4px;font-size:11px;color:var(--sub)}
.bticks span{position:absolute;transform:translateX(-50%)}
.bn{font-size:13px;color:var(--sub);margin-top:6px}
.bn b{color:var(--text)}

/* 입력 유도 */
.hint{color:var(--sub);font-size:14px}
.hrow{display:flex;gap:8px;margin-top:10px}
.hrow input{flex:1;min-width:0;background:#0c131a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font-size:16px}
.hrow button{padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:#062420;font-weight:700;font-size:15px}

/* 날짜 라인·제목 강조 */
.datebar h2.prompt{color:var(--accent);font-size:18px;white-space:nowrap}
.dline{font-size:13px;color:var(--sub);margin-top:4px}
.dline em{font-style:normal;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
.dline em.tp{background:var(--accent);color:#062420}
.dline em.tn{background:rgba(224,169,91,.2);color:var(--accent2)}

/* 마라톤 키-체중 */
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mh b{font-size:34px;font-variant-numeric:tabular-nums}
.mh small{font-size:13px;color:var(--sub);margin-left:6px;font-weight:500}
.mh span{font-size:15px;font-weight:700;text-align:right}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mrow span:first-child{color:var(--sub)}
.mrow b{color:var(--text)}

/* 그래프 */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:13px}
.tabs button.on{background:#1d2935;color:var(--text);border-color:var(--accent)}
canvas{width:100%;height:230px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.lg{background:none;border:1px solid #3a4a5a;border-radius:999px;color:var(--text);font-size:12px;padding:3px 10px;opacity:.45}
.lg.on{opacity:1}
.legend i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.legend i.dot{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-sizing:border-box;height:9px;vertical-align:baseline}

/* 기록 목록·설정 */
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:nth-child(2),td:nth-child(3){text-align:right}
td.del{text-align:right;width:36px}
td.del button{background:none;border:0;color:var(--sub);font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{flex:1;font-size:14px;color:var(--sub)}
.row input{width:110px;background:#0c131a;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px;font-size:15px;text-align:right}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btns button,.btns label{flex:1;min-width:100px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:#1d2935;color:var(--text);font-size:14px;text-align:center}
details summary{cursor:pointer;color:var(--sub);font-size:14px;font-weight:600}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:16px 0}
.more{background:none;border:0;color:var(--accent);font-size:13px;width:100%;padding:8px}
</style>
</head>
<body>

<div class="card">
  <div class="datebar">
    <div>
      <h2 id="title">오늘 체중</h2>
      <div id="dline" class="dline"></div>
      <div id="badge" class="badge warn"></div>
    </div>
    <input type="date" id="d" autocomplete="off">
  </div>
  <button id="goToday" type="button" hidden></button>
  <div class="entry">
    <button class="step" data-s="-0.1">−</button>
    <input id="w" type="number" inputmode="decimal" step="0.1" placeholder="00.0" autocomplete="off">
    <button class="step" data-s="0.1">+</button>
  </div>
  <button id="save">저장</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h2>최근 3일</h2>
  <div class="strip" id="strip"></div>
</div>

<div class="card">
  <h2>추세</h2>
  <div id="trend"></div>
</div>

<div class="card">
  <h2>목표</h2>
  <div id="goalBox"></div>
</div>

<div class="card">
  <h2>마라톤 완주 · 키 − 체중</h2>
  <div id="mrBox"></div>
</div>

<div class="card">
  <h2>BMI</h2>
  <div id="bmiBox"></div>
</div>

<div class="card">
  <div class="tabs" id="tabs">
    <button data-r="30" class="on">1개월</button>
    <button data-r="90">3개월</button>
    <button data-r="365">1년</button>
    <button data-r="0">전체</button>
  </div>
  <canvas id="c"></canvas>
  <div class="legend">
    <span><i style="background:#8a9bab"></i>일일 체중</span>
    <button class="lg on" data-ma="7" type="button"><i style="background:var(--accent)"></i>7일 평균</button>
    <button class="lg on" data-ma="30" type="button"><i style="background:#a78bfa"></i>30일 평균</button>
    <span><i class="dot"></i> 오늘</span>
    <span id="lgGoal" style="display:none"><i style="background:var(--accent2)"></i>목표</span>
  </div>
</div>

<div class="card">
  <h2>기록</h2>
  <table id="list"></table>
  <button class="more" id="more" style="display:none">더 보기</button>
</div>

<div class="card">
  <details>
    <summary>설정 · 백업</summary>
    <div style="margin-top:12px">
      <div class="row"><label>키 (cm)</label><input id="h" type="number" inputmode="decimal" step="0.1"></div>
      <div class="row"><label>목표 체중 (kg)</label><input id="g" type="number" inputmode="decimal" step="0.1"></div>
      <div class="row"><label>시작 체중 (kg) · 비우면 첫 기록</label><input id="s" type="number" inputmode="decimal" step="0.1"></div>
      <div class="btns">
        <button id="exp">백업 파일 저장</button>
        <label>백업 불러오기<input id="imp" type="file" accept=".json,.csv,application/json,text/csv" hidden></label>
        <button id="csv">CSV 내보내기</button>
      </div>
      <p style="font-size:12px;color:var(--sub);line-height:1.5;margin:10px 0 0">
        기록은 이 폰의 브라우저 안에만 저장됩니다. Chrome의 사이트 데이터를 지우면 함께 지워지니
        가끔 백업 파일을 저장해 두세요.</p>
    </div>
  </details>
</div>

<div id="ok" aria-live="polite">
  <div class="okbox">
    <div class="okc"><svg viewBox="0 0 50 50"><path d="M12 26 L22 36 L39 15"/></svg></div>
    <div class="okt" id="okt">저장 완료</div>
    <div class="okw" id="okw"></div>
    <div class="okd" id="okd"></div>
  </div>
</div>

<script>
const KEY='weightlog.v1', SKEY='weightlog.settings.v1';
const $=id=>document.getElementById(id);
let data=load(), settings=loadS(), range=30, listN=14, lastToday='';

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function loadS(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 실패: '+e.message)}}
function persistS(){try{localStorage.setItem(SKEY,JSON.stringify(settings))}catch(e){}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const DAY=864e5;
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const addDays=(s,n)=>ymd(new Date(parse(s).getTime()+n*DAY));
const f1=x=>x==null||isNaN(x)?'–':x.toFixed(1);
const sgn=x=>x==null||isNaN(x)?'–':(x>0.049?'+':x<-0.049?'−':'±')+Math.abs(x).toFixed(1);
const cls=x=>x>0.05?'up':x<-0.05?'down':'';
const today=()=>ymd(new Date());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const md=s=>`${+s.slice(5,7)}/${+s.slice(8)}`;
function relLabel(s){const n=dayDiff(s,today());return n===0?'오늘':n===1?'어제':n===2?'그저께':md(s)}
const WK='일월화수목금토';
const fullDate=s=>`${+s.slice(5,7)}월 ${+s.slice(8)}일 (${WK[parse(s).getDay()]})`;
function titleFor(s){const n=dayDiff(s,today());return n===0?'오늘':n===1?'어제':n===2?'그저께':`${+s.slice(5,7)}월 ${+s.slice(8)}일`}

function sorted(){return Object.keys(data).sort().map(d=>({d,w:data[d]}))}
function prevBefore(date){let v=null;for(const r of sorted()){if(r.d<date)v=r.w;else break}return v}
function recAtOrBefore(rows,date){let v=null;for(const r of rows){if(r.d<=date)v=r;else break}return v}

// 7일 이동평균(달력 기준 7일 창) — 그래프와 추세 계산에만 사용
function maN(rows,N){
  return rows.map((r,i)=>{
    let s=0,n=0;
    for(let j=i;j>=0;j--){if(dayDiff(rows[j].d,r.d)>N-1)break;s+=rows[j].w;n++}
    return s/n;
  });
}
const ma7=rows=>maN(rows,7);
const maOn=()=>{const o=settings.ma||{};return {7:o[7]!==false,30:o[30]!==false}};
// 최근 3주 이동평균의 기울기(kg/일)
function calcSlope(rows){
  if(rows.length<5)return null;
  const m=ma7(rows), r2=rows.map((r,i)=>({d:r.d,m:m[i]})), last=r2[r2.length-1];
  const tr=r2.filter(r=>dayDiff(r.d,last.d)<21);
  if(tr.length<5||dayDiff(tr[0].d,last.d)<7)return null;
  const xs=tr.map(r=>dayDiff(tr[0].d,r.d)), ys=tr.map(r=>r.m);
  const xm=xs.reduce((a,b)=>a+b)/xs.length, ym=ys.reduce((a,b)=>a+b)/ys.length;
  let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-xm)*(ys[i]-ym);de+=(x-xm)**2});
  return de?nu/de:null;
}

/* ---------- 입력 카드 ---------- */
function fillInput(){
  const d=$('d').value;
  if(data[d]!=null)$('w').value=data[d].toFixed(1);
  else{const p=prevBefore(d);$('w').value=p!=null?p.toFixed(1):''}
  updateEntry();renderStrip();
}
let saveBusy=false;
function updateEntry(){
  const d=$('d').value||today(), v=parseFloat($('w').value), s=data[d];
  const same=s!=null&&!isNaN(v)&&Math.abs(v-s)<0.05;
  const isT=d===today();
  $('title').textContent=isT?(s!=null?'오늘 체중':'오늘 체중 기록하세요!'):titleFor(d)+' 체중';
  $('title').classList.toggle('prompt',isT&&s==null);
  $('dline').innerHTML=`${fullDate(d)}<em class="${isT?'tp':'tn'}">${isT?'오늘':'오늘 아님'}</em>`;
  const b=$('badge');
  if(same){b.textContent=`✓ ${titleFor(d)} 기록 저장됨`;b.className='badge ok'}
  else if(s!=null){b.textContent='값이 바뀌었어요 · 저장을 눌러야 반영돼요';b.className='badge warn'}
  else{b.textContent=`${titleFor(d)} 기록 아직 저장 안 됨`;b.className='badge warn'}
  if(!saveBusy){$('save').textContent=s!=null?'수정 저장':'저장';$('save').classList.toggle('quiet',same)}
  // 보고 있는 날짜가 오늘이 아니면 '오늘 기록하기' 버튼을 맨 위에 띄움
  const g=$('goToday'), t=today();
  if(d!==t){g.hidden=false;g.textContent=`오늘(${md(t)}) 기록하러 가기 ›`}
  else g.hidden=true;
}

/* ---------- 최근 3일 ---------- */
function renderStrip(){
  const sel=$('d').value||today();
  $('strip').innerHTML=[-2,-1,0].map(k=>{
    const d=addDays(sel,k), w=data[d], p=prevBefore(d);
    let v,s;
    if(w!=null){
      v=`<div class="v">${f1(w)}</div>`;
      s=p!=null?`<div class="s ${cls(w-p)}">${sgn(w-p)}</div>`:`<div class="s mute">첫 기록</div>`;
    }else{
      v=`<div class="v miss">–</div>`;
      s=d===today()?`<div class="s warn">미입력</div>`:`<div class="s mute">기록 없음</div>`;
    }
    return `<div class="cell ${k===0?'sel':''}"><div class="k">${relLabel(d)}</div>${v}${s}</div>`;
  }).join('');
}

/* ---------- 추세 ---------- */
function renderTrend(){
  const rows=sorted(), box=$('trend');
  const slope=calcSlope(rows);
  if(slope==null){box.innerHTML='<div class="empty">기록이 5일 이상, 1주일 넘게 쌓이면<br>주간 변화 추세가 나와요</div>';return}
  const last=rows[rows.length-1], pw=slope*7;
  const dir=pw>0.1?'up':pw<-0.1?'down':'flat';
  let tone='';
  if(dir!=='flat'){
    const toward=settings.g?((settings.g<last.w&&dir==='down')||(settings.g>last.w&&dir==='up')):dir==='down';
    tone=toward?'good':'bad';
  }
  const arrow={up:'↗',down:'↘',flat:'→'}[dir], word={up:'증가 중',down:'감소 중',flat:'유지 중'}[dir];
  const base=recAtOrBefore(rows,addDays(last.d,-30));
  const m30=base&&dayDiff(base.d,addDays(last.d,-30))<=5?` · 30일 전보다 ${sgn(last.w-base.w)}kg`:'';
  box.innerHTML=`<div class="trend ${tone}"><div class="arrow">${arrow}</div>
    <div><div class="big">${sgn(pw)}<small>kg / 주</small></div>
    <div class="tsub">${word} · 최근 3주 기준${m30}</div></div></div>`;
}

/* ---------- 입력 유도 카드 ---------- */
const hint=(msg,key,ph)=>`<div class="hint">${msg}<div class="hrow"><input id="in_${key}" type="number" inputmode="decimal" step="0.1" placeholder="${ph}"><button data-hint="${key}">저장</button></div></div>`;

/* ---------- 목표 ---------- */
function renderGoal(){
  const box=$('goalBox'), rows=sorted();
  if(!settings.g){box.innerHTML=hint('목표 체중을 입력하면 달성률 막대가 나와요','g','목표 체중 (kg)');return}
  if(!rows.length){box.innerHTML='<div class="empty">첫 체중을 입력하면 막대가 나와요</div>';return}
  const last=rows[rows.length-1], cur=last.w, goal=settings.g, start=settings.s||rows[0].w, total=start-goal;
  const achieved=Math.abs(total)<0.1?Math.abs(cur-goal)<0.1:(total>0?cur<=goal:cur>=goal);
  let pct=Math.abs(total)<0.1?(achieved?100:0):(start-cur)/total*100;
  pct=achieved?100:clamp(Math.round(pct),0,99);
  const slope=calcSlope(rows), mLast=ma7(rows).slice(-1)[0], left=mLast-goal;
  let eta;
  if(achieved)eta='목표 달성 🎉';
  else if(slope==null)eta='기록이 쌓이면 예상 도달일이 나와요';
  else if(Math.sign(slope)===-Math.sign(left)){
    const days=Math.abs(left/slope);
    eta=days>730?'현재 속도로는 2년 이상 걸려요':`현재 속도면 ${addDays(last.d,Math.round(days)).replace(/-/g,'.')} 즈음 도달`;
  }else eta='최근 추세가 목표와 반대 방향이에요';
  box.innerHTML=`<div class="gh"><b>${pct}%</b><span>${achieved?'달성':f1(Math.abs(cur-goal))+' kg 남음'}</span></div>
    <div class="gbar"><i style="width:${pct}%"></i></div>
    <div class="gl"><span>시작 ${f1(start)}${settings.s?'':' (첫 기록)'}</span><span>목표 ${f1(goal)}</span></div>
    <div class="gs">${eta}</div>`;
}

/* ---------- 마라톤: 키 − 체중 ---------- */
function renderMarathon(){
  const box=$('mrBox'), rows=sorted();
  if(!settings.h){box.innerHTML=hint('키를 입력하면 키 − 체중 값이 나와요','h','키 (cm)');return}
  if(!rows.length){box.innerHTML='<div class="empty">첫 체중을 입력하면 값이 나와요</div>';return}
  const H=settings.h, last=rows[rows.length-1], w=last.w, v=H-w;
  const t100=H-100, t110=H-110;
  const lo=Math.min(80,Math.floor(v/10)*10), hi=120, span=hi-lo;
  const pos=x=>clamp((x-lo)/span,0,1)*100;
  const COL={low:'#e0a95b',ok:'#5fb98a',best:'#5b9bd5'};
  const st=v>=110?{t:'이상적 구간 🎉',c:COL.best}:v>=100?{t:'완주권 도달 ✅',c:COL.ok}:{t:`100까지 ${(100-v).toFixed(1)} 남음`,c:COL.low};
  const seg=[[lo,100,COL.low],[100,110,COL.ok],[110,hi,COL.best]].map(([a,b,c])=>`<i style="flex:${b-a};background:${c}"></i>`).join('');
  const tick=(x,t)=>`<span style="left:${pos(x)}%">${t}</span>`;
  const slope=calcSlope(rows), mLast=ma7(rows).slice(-1)[0];
  let eta='';
  if(v<100){
    eta=(slope!=null&&slope<0)?`현재 속도면 ${addDays(last.d,Math.round((mLast-t100)/-slope)).replace(/-/g,'.')} 즈음 100 도달`:'추세가 쌓이면 100 도달 예상일이 나와요';
  }
  const line=(lbl,target,goalV)=>{
    const diff=w-target;
    return `<div class="mrow"><span>${lbl}</span><span>${diff>0.049?`<b>${diff.toFixed(1)} kg</b> 더 감량 (체중 ${target.toFixed(1)}kg)`:`<b>달성 ✓</b> (체중 ${target.toFixed(1)}kg 이하)`}</span></div>`};
  box.innerHTML=`<div class="mh"><div><b>${v.toFixed(1)}</b><small>${H} − ${w.toFixed(1)}</small></div><span style="color:${st.c}">${st.t}</span></div>
    <div class="bmiwrap"><div class="mk" style="left:${pos(v)}%"></div><div class="bmibar">${seg}</div></div>
    <div class="bticks" style="margin-bottom:6px">${tick(100,'100 완주권')}${tick(110,'110 이상적')}</div>
    ${line('100 달성',t100)}${line('110 달성',t110)}
    ${eta?`<div class="mrow"><span>예상</span><span>${eta}</span></div>`:''}`;
}

/* ---------- BMI ---------- */
const ZONES=[{n:'저체중',a:15,b:18.5,c:'#5b9bd5'},{n:'정상',a:18.5,b:23,c:'#4fb3a9'},{n:'과체중',a:23,b:25,c:'#e0a95b'},{n:'비만',a:25,b:35,c:'#e07a6b'}];
function renderBmi(){
  const box=$('bmiBox'), rows=sorted();
  if(!settings.h){box.innerHTML=hint('키를 입력하면 BMI와 정상 범위가 나와요','h','키 (cm)');return}
  if(!rows.length){box.innerHTML='<div class="empty">첫 체중을 입력하면 BMI가 나와요</div>';return}
  const h=settings.h/100, w=rows[rows.length-1].w, bmi=w/(h*h);
  const z=ZONES.find(z=>bmi<z.b)||ZONES[3];
  const pos=clamp((bmi-15)/20,0,1)*100;
  const seg=ZONES.map(z=>`<i style="flex:${z.b-z.a};background:${z.c}"></i>`).join('');
  const tick=v=>`<span style="left:${(v-15)/20*100}%">${v}</span>`;
  box.innerHTML=`<div class="bh"><b>${bmi.toFixed(1)}</b><span style="color:${z.c}">${z.n}</span></div>
    <div class="bmiwrap"><div class="mk" style="left:${pos}%"></div><div class="bmibar">${seg}</div></div>
    <div class="bticks">${tick(18.5)}${tick(23)}${tick(25)}</div>
    <div class="bn">정상 체중 범위 <b>${(18.5*h*h).toFixed(1)} – ${(22.9*h*h).toFixed(1)} kg</b> (키 ${settings.h}cm)</div>`;
}

/* ---------- 그래프 ---------- */
function renderChart(){
  const cv=$('c'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  $('lgGoal').style.display=settings.g?'':'none';
  const msg=t=>{x.fillStyle='#8a9bab';x.font='14px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,W/2,H/2)};
  let rows=sorted();
  if(rows.length<2){msg('기록이 2개 이상 쌓이면 그래프가 나와요');return}
  const m7=maN(rows,7),m30=maN(rows,30);rows.forEach((r,i)=>{r.m=m7[i];r.m30=m30[i]});
  const on=maOn();
  document.querySelectorAll('.lg').forEach(b=>b.classList.toggle('on',!!on[b.dataset.ma]));
  const tdy=today(), last=rows[rows.length-1].d, end=tdy>last?tdy:last;   // 오른쪽 끝은 항상 오늘
  if(range)rows=rows.filter(r=>dayDiff(r.d,end)<range);
  if(!rows.length){msg('이 기간에는 기록이 없어요');return}
  const start=range?addDays(end,-(range-1)):rows[0].d;
  const span=Math.max(1,dayDiff(start,end));
  const vs=r=>[r.w].concat(on[7]?[r.m]:[],on[30]?[r.m30]:[]);
  let lo=Math.min(...rows.flatMap(vs)),hi=Math.max(...rows.flatMap(vs));
  if(settings.g&&settings.g>lo-3&&settings.g<hi+3){lo=Math.min(lo,settings.g);hi=Math.max(hi,settings.g)}
  if(hi-lo<1){const c=(hi+lo)/2;lo=c-.5;hi=c+.5}
  const padv=(hi-lo)*.14;lo-=padv;hi+=padv;
  const L=38,R=12,T=36,B=22,pw=W-L-R,ph=H-T-B;
  const X=d=>L+dayDiff(start,d)/span*pw, Y=v=>T+(hi-v)/(hi-lo)*ph;

  x.strokeStyle='#243241';x.fillStyle='#8a9bab';x.font='11px sans-serif';x.lineWidth=1;
  const stepv=niceStep((hi-lo)/4);
  x.textAlign='right';x.textBaseline='middle';
  for(let v=Math.ceil(lo/stepv)*stepv;v<=hi;v+=stepv){
    x.beginPath();x.moveTo(L,Y(v));x.lineTo(W-R,Y(v));x.stroke();
    x.fillText(stepv<1?v.toFixed(1):v.toFixed(0),L-6,Y(v));
  }
  x.textAlign='center';x.textBaseline='top';
  for(let i=0;i<=4;i++){const d=addDays(start,Math.round(span*i/4));
    x.fillText(md(d),Math.min(Math.max(X(d),L+12),W-R-12),H-B+6)}

  if(settings.g){x.strokeStyle='#e0a95b';x.setLineDash([5,4]);x.beginPath();
    x.moveTo(L,Y(settings.g));x.lineTo(W-R,Y(settings.g));x.stroke();x.setLineDash([])}

  x.strokeStyle='rgba(138,155,171,.35)';x.lineWidth=1;x.beginPath();
  rows.forEach((r,i)=>i?x.lineTo(X(r.d),Y(r.w)):x.moveTo(X(r.d),Y(r.w)));x.stroke();
  x.fillStyle='#8a9bab';const rad=rows.length>120?1.5:2.5;
  rows.forEach(r=>{x.beginPath();x.arc(X(r.d),Y(r.w),rad,0,7);x.fill()});
  [[30,'m30','#a78bfa',2],[7,'m','#4fb3a9',2.5]].forEach(([n,k,c,wd])=>{
    if(!on[n])return;
    x.strokeStyle=c;x.lineWidth=wd;x.lineJoin='round';x.beginPath();
    rows.forEach((r,i)=>i?x.lineTo(X(r.d),Y(r[k])):x.moveTo(X(r.d),Y(r[k])));x.stroke();
  });

  // 오늘 강조: 라벨은 그래프 위쪽 빈 띠에 두고 점선으로 오늘 지점에 연결 (그래프 선을 가리지 않음)
  if(dayDiff(start,tdy)>=0&&dayDiff(tdy,end)>=0){
    const tx=X(tdy), has=data[tdy]!=null, col=has?'#4fb3a9':'#e0a95b';
    const lb=has?`오늘 ${f1(data[tdy])} kg`:'오늘 미입력';
    x.font='bold 12px sans-serif';x.textBaseline='middle';
    const lw=x.measureText(lb).width+16, ly=13;
    const lx=Math.min(Math.max(tx-lw/2,L),W-4-lw);
    const ty=has?Y(data[tdy]):H-B;
    x.strokeStyle=has?'rgba(255,255,255,.55)':col;x.lineWidth=1.2;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(tx,ly+11);x.lineTo(tx,has?ty-8:H-B);x.stroke();x.setLineDash([]);
    x.fillStyle='#17212c';x.strokeStyle=col;x.lineWidth=1.5;
    x.beginPath();x.roundRect(lx,ly-11,lw,22,8);x.fill();x.stroke();
    x.fillStyle=has?'#fff':col;x.textAlign='center';x.fillText(lb,lx+lw/2,ly);
    if(has){
      x.fillStyle='rgba(255,255,255,.2)';x.beginPath();x.arc(tx,ty,12,0,7);x.fill();
      x.fillStyle='#fff';x.strokeStyle='#4fb3a9';x.lineWidth=3;x.beginPath();x.arc(tx,ty,6,0,7);x.fill();x.stroke();
    }
  }
}
function niceStep(raw){const p=10**Math.floor(Math.log10(raw)),n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}

function renderList(){
  const rows=sorted().reverse();
  if(!rows.length){$('list').innerHTML='<tr><td class="empty">아직 기록이 없어요</td></tr>';$('more').style.display='none';return}
  const W=['일','월','화','수','목','금','토'];
  $('list').innerHTML=rows.slice(0,listN).map((r,i)=>{
    const p=rows[i+1],dd=p?r.w-p.w:null,dt=parse(r.d);
    return `<tr><td>${dt.getMonth()+1}/${dt.getDate()} (${W[dt.getDay()]})</td><td><b>${f1(r.w)}</b></td>
      <td class="${cls(dd)}">${dd==null?'':sgn(dd)}</td><td class="del"><button data-del="${r.d}" aria-label="삭제">✕</button></td></tr>`}).join('');
  $('more').style.display=rows.length>listN?'':'none';
}

function renderAll(){updateEntry();renderStrip();renderTrend();renderGoal();renderMarathon();renderBmi();renderChart();renderList()}

/* ---------- 저장 피드백 ---------- */
function celebrate(w,prev,d){
  $('okt').textContent=`${titleFor(d)} 체중 저장 완료`;
  $('okw').textContent=w.toFixed(1)+' kg';
  const diff=prev!=null?w-prev:null;
  const el=$('okd');
  el.textContent=diff==null?'첫 기록이에요':`이전 기록보다 ${sgn(diff)} kg`;
  el.className='okd '+(diff==null?'':cls(diff));
  const ok=$('ok');ok.classList.add('show');
  clearTimeout(celebrate.t);celebrate.t=setTimeout(()=>ok.classList.remove('show'),2800);
  try{if(navigator.vibrate)navigator.vibrate([40,60,90])}catch(e){}
}
function flash(t){$('msg').textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>$('msg').textContent='',2500)}

/* ---------- 이벤트 ---------- */
$('d').value=today();$('d').max=today();lastToday=today();
let userPicked=false, hiddenAt=0;
// 날짜를 항상 실제 '오늘'에 맞춤. 사용자가 달력에서 직접 고른 날짜만 유지.
function syncToday(){
  const t=today();
  $('d').max=t;
  if(t!==lastToday){lastToday=t;userPicked=false}      // 자정이 지났으면 선택 초기화
  if(!userPicked&&$('d').value!==t){$('d').value=t;fillInput();renderAll()}
  else updateEntry();
}
$('d').onchange=()=>{
  if(!$('d').value)$('d').value=today();
  userPicked=$('d').value!==today();
  fillInput();
};
$('goToday').onclick=()=>{userPicked=false;$('d').value=today();fillInput();$('w').focus()};
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
  const v=parseFloat($('w').value)||0;$('w').value=Math.max(0,v+parseFloat(b.dataset.s)).toFixed(1);updateEntry()});
$('w').addEventListener('input',updateEntry);
$('save').onclick=()=>{
  const v=parseFloat($('w').value),d=$('d').value;
  if(!(v>20&&v<300)){flash('체중을 확인해 주세요');return}
  if(!d){flash('날짜를 선택해 주세요');return}
  const prev=prevBefore(d);
  data[d]=Math.round(v*10)/10;persist();
  saveBusy=true;const sb=$('save');sb.textContent='✓ 저장 완료';sb.classList.remove('quiet');sb.classList.add('done');
  setTimeout(()=>{saveBusy=false;sb.classList.remove('done');updateEntry()},2800);
  renderAll();$('w').blur();celebrate(data[d],prev,d);
};
$('w').addEventListener('keydown',e=>{if(e.key==='Enter')$('save').click()});
$('ok').onclick=()=>$('ok').classList.remove('show');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));range=+b.dataset.r;renderChart()};
$('list').onclick=e=>{const d=e.target.dataset.del;if(!d)return;
  if(confirm(`${d} 기록(${f1(data[d])} kg)을 삭제할까요?`)){delete data[d];persist();renderAll();fillInput()}};
$('more').onclick=()=>{listN+=30;renderList()};

function syncSettingsInputs(){$('h').value=settings.h||'';$('g').value=settings.g||'';$('s').value=settings.s||''}
syncSettingsInputs();
['h','g','s'].forEach(k=>$(k).onchange=()=>{settings[k]=parseFloat($(k).value)||null;persistS();renderAll()});
document.addEventListener('click',e=>{
  const k=e.target.dataset&&e.target.dataset.hint;if(!k)return;
  const v=parseFloat($('in_'+k).value);
  if(!(v>0)){$('in_'+k).focus();return}
  settings[k]=v;persistS();syncSettingsInputs();renderAll();
});

function download(name,text,type){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exp').onclick=()=>download(`weight-backup-${today()}.json`,JSON.stringify({version:1,data,settings},null,1),'application/json');
$('csv').onclick=()=>download(`weight-${today()}.csv`,'date,weight\n'+sorted().map(r=>`${r.d},${r.w}`).join('\n'),'text/csv');
$('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const t=await f.text();let inc={},s=null;
  try{
    if(t.trim().startsWith('{')){const j=JSON.parse(t);inc=j.data||j;s=j.settings||null}
    else t.split(/\r?\n/).forEach(l=>{const[d,w]=l.split(',');if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&+w>0)inc[d]=+w});
  }catch(err){alert('파일을 읽지 못했어요');return}
  const n=Object.keys(inc).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&typeof inc[k]==='number').length;
  if(!n){alert('불러올 기록이 없어요');return}
  if(!confirm(`${n}개 기록을 불러옵니다. 같은 날짜는 백업 값으로 덮어씁니다. 계속할까요?`))return;
  for(const k in inc)if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&typeof inc[k]==='number')data[k]=inc[k];
  if(s){settings={...settings,...s};syncSettingsInputs();persistS()}
  persist();fillInput();renderAll();e.target.value='';alert('불러오기 완료');
};
window.addEventListener('resize',renderChart);
// 앱을 켜 둔 채 날짜가 바뀌는 경우: 여러 신호에서 모두 확인
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>10*60*1000)userPicked=false;   // 10분 넘게 벗어났다 오면 오늘로
  hiddenAt=0;syncToday();
});
window.addEventListener('pageshow',syncToday);
window.addEventListener('focus',syncToday);
window.addEventListener('load',syncToday);                          // 브라우저가 입력값을 복원해도 덮어씀
setInterval(syncToday,30000);

document.querySelector('.legend').addEventListener('click',e=>{
  const b=e.target.closest('.lg');if(!b)return;
  const o=maOn();o[b.dataset.ma]=!o[b.dataset.ma];settings.ma=o;persistS();renderChart();
});

fillInput();renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
